<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Mini Balatro</title>
<style>
:root{--bg:#1a2a1f;--card:#f8f4e8;--red:#c0392b;--black:#222;--gold:#f1c40f;--panel:#243a2c}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(circle at top,#25402f,var(--bg));color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:10px;overflow-x:hidden}
h1{font-size:20px;margin:4px 0;color:var(--gold)}
.stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:13px;margin-bottom:6px}
.stat{background:var(--panel);padding:6px 9px;border-radius:8px}
.stat.boss{background:#7b241c}
.bossInfo{font-size:13px;color:#ffb3a7;min-height:18px;margin-bottom:4px;text-align:center}
.jokers{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:50px;margin-bottom:8px}
.joker{background:#6c3483;padding:5px;border-radius:6px;font-size:11px;width:98px;text-align:center;animation:pop .4s}
.joker.legend{background:linear-gradient(135deg,#b7950b,#f1c40f);color:#222}
.joker .trig{display:block;opacity:.7;font-size:10px;margin-top:2px}
.hand{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0;min-height:90px}
.card{width:58px;height:82px;background:var(--card);color:var(--black);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:bold;cursor:pointer;border:3px solid transparent;user-select:none;transition:transform .15s,box-shadow .15s;box-shadow:0 3px 6px #0006}
.card.red{color:var(--red)}
.card.selected{border-color:var(--gold);transform:translateY(-12px);box-shadow:0 8px 14px #000a}
.card.deal{animation:deal .35s both}
.card .suit{font-size:22px}
@keyframes deal{from{transform:translateY(-40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.popup{position:fixed;top:40%;left:50%;font-size:30px;font-weight:bold;color:var(--gold);text-shadow:0 2px 4px #000;pointer-events:none;animation:float 1.2s forwards;z-index:10}
@keyframes float{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-150%)}}
.buttons{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap;justify-content:center}
button{background:#27ae60;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-size:14px;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.96)}
button:disabled{background:#555;cursor:not-allowed}
button.alt{background:#2980b9}
button.danger{background:#c0392b}
button.gray{background:#7f8c8d}
#msg{min-height:40px;text-align:center;margin:6px;font-size:15px;color:#ffe08a;max-width:440px}
.panel{background:var(--panel);border-radius:10px;padding:12px;width:100%;max-width:440px}
.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
.overlay.show{display:flex}
.overlay .panel{max-height:90vh;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;background:#1e3026;padding:8px;border-radius:6px;margin-bottom:6px;font-size:14px;gap:6px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #fff2}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1}
.info{font-size:12px;opacity:.75;text-align:center;max-width:440px;margin-top:8px}
.lastHand{margin-bottom:6px}
h2.t{text-align:center;color:var(--gold);margin:0 0 10px}
</style>
</head>
<body>
<h1>🃏 Mini Balatro</h1>

<div class="stats">
  <div class="stat">Ante <b id="ante">-</b></div>
  <div class="stat" id="blindStat">-</div>
  <div class="stat">Цель <b id="target">-</b></div>
  <div class="stat">Очки <b id="score">0</b></div>
  <div class="stat">Руки <b id="hands">0</b></div>
  <div class="stat">Сбросы <b id="discards">0</b></div>
  <div class="stat">💰 <b id="money">0</b></div>
</div>
<div class="bossInfo" id="bossInfo"></div>
<div class="jokers" id="jokers"></div>
<div class="stat lastHand" id="lastHand">Комбинация: —</div>
<div class="hand" id="hand"></div>
<div class="buttons">
  <button id="playBtn">▶ Сыграть</button>
  <button class="alt" id="discardBtn">♻ Сброс</button>
  <button class="gray" id="sortBtn">🔀</button>
  <button class="gray" id="skipBtn">⏭ Пропуск</button>
  <button class="gray" id="soundBtn">🔊</button>
  <button class="gray" id="boardBtn">🏆</button>
</div>
<div id="msg"></div>
<div class="info">Выбери до 5 карт. Набери цель блайнда, чтобы попасть в магазин. Босса пропустить нельзя.</div>

<div class="overlay show" id="menu">
  <div class="panel">
    <h2 class="t" id="menuTitle">Выбор колоды</h2>
    <div id="deckList"></div>
    <button id="continueBtn" class="alt" style="width:100%;margin-top:8px;display:none">Продолжить сохранённую игру</button>
  </div>
</div>

<div class="overlay" id="shop">
  <div class="panel">
    <h2 class="t">🛒 Магазин</h2>
    <div id="shopItems"></div>
    <button id="nextBtn" class="alt" style="width:100%;margin-top:6px">Дальше ▶</button>
  </div>
</div>

<div class="overlay" id="board">
  <div class="panel">
    <h2 class="t" id="boardTitle">🏆 Таблица лидеров</h2>
    <div class="tabs">
      <button id="tabWeek" class="alt">Неделя</button>
      <button id="tabAll" class="gray">Всё время</button>
    </div>
    <div id="boardList">Загрузка...</div>
    <button class="gray" id="closeBoard" style="width:100%;margin-top:8px">Закрыть</b
