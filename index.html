<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>Mini Balatro</title>
<style>
:root{--gold:#f1c40f;--card-bg:#fbf7ee;--black:#1d2433;--red:#c8323c;--panel:#2f3d2e;--panel-dark:#1f2a1e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:system-ui,sans-serif;color:#fff;overflow:hidden;user-select:none;
  background:radial-gradient(ellipse at 60% 40%,#7d916c 0%,#44573f 70%,#2c3a2a 100%)}

/* ---------- Каркас стола ---------- */
#app{display:grid;grid-template-columns:200px 1fr;gap:8px;height:100vh;padding:8px;position:relative}

/* ---------- Левая панель ---------- */
#side{display:flex;flex-direction:column;gap:6px;min-height:0}
.blindBox{background:var(--panel);border:2px solid var(--panel-dark);border-radius:10px;padding:8px;text-align:center}
.blindName{font-weight:700;font-size:17px;background:#6e8a63;border-radius:8px;padding:6px;text-shadow:0 2px 0 #222}
.blindName.boss{background:#8b2d24}
.bossInfo{font-size:11px;color:#ffb3a7;min-height:14px;margin:4px 0}
.target{font-size:12px;opacity:.9;margin-top:4px}
.target b{display:block;font-size:26px;color:#ff5a4a;text-shadow:0 2px 0 #000}
.box{background:var(--panel);border:2px solid var(--panel-dark);border-radius:10px;padding:6px;text-align:center;font-size:12px}
.box b{display:block;font-size:24px;color:#fff;margin-top:2px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.money b{color:#f5a623;font-size:30px}
.sideBtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto}

/* ---------- Главная область ---------- */
#main{display:flex;flex-direction:column;min-width:0;min-height:0}
.topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.jokers{display:flex;gap:6px;flex-wrap:wrap;min-height:112px}
.joker{width:84px;height:112px;background:#fff;color:#222;border-radius:8px;border:3px solid #555;padding:4px;font-size:10px;text-align:center;overflow:hidden;box-shadow:0 4px 8px rgba(0,0,0,.4);animation:pop .4s}
.joker b{display:block;font-size:12px;margin-bottom:3px}
.joker.legend{background:linear-gradient(135deg,#b7950b,#f1c40f)}
.joker .trig{display:block;opacity:.7;font-size:9px;margin-top:3px}
#consumables{display:flex;flex-direction:column;gap:6px;align-items:flex-end;min-width:150px}
#consumables button{font-size:12px;padding:6px 10px}
.curHand{align-self:center;font-size:15px;min-height:22px;margin:8px 0 2px;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:8px}
#msg{text-align:center;color:#ffe08a;min-height:20px;font-size:14px;margin:2px}
.hand{flex:1;display:flex;justify-content:center;align-items:flex-end;padding-bottom:12px;min-height:150px}

/* ---------- Карта ---------- */
.gcard{position:relative;width:76px;height:108px;margin-left:-18px;background:radial-gradient(circle at 30% 20%,#fff 0%,transparent 60%),var(--card-bg);border:1px solid #d9d0bb;border-radius:10px;color:var(--black);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 6px 14px rgba(0,0,0,.45);transition:transform .2s cubic-bezier(.2,.8,.3,1.2),box-shadow .2s}
.gcard:first-child{margin-left:0}
.gcard.red{color:var(--red)}
.gcard.selected{transform:translateY(-16px);border-color:var(--gold);box-shadow:0 8px 14px #000a,0 0 0 2px var(--gold)}
.gcard.deal{animation:deal .35s both}
.gcard::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);mix-blend-mode:overlay;opacity:0;transition:opacity .3s;pointer-events:none}
.gcard.selected::after{opacity:.9}
.gcard .corner{position:absolute;display:flex;flex-direction:column;align-items:center;font-weight:800;line-height:1}
.gcard .corner b{font-size:15px;letter-spacing:-1px}
.gcard .corner i{font-style:normal;font-size:12px;margin-top:1px}
.gcard .tl{top:4px;left:5px}
.gcard .br{bottom:4px;right:5px;transform:rotate(180deg)}
.gcard .pip{font-size:30px;opacity:.92}

/* ---------- Нижняя панель кнопок ---------- */
.bottom{display:flex;justify-content:center;align-items:center;gap:10px;padding:6px 0 4px;flex-wrap:wrap}
.bottom button{padding:12px 18px;font-size:15px;border-radius:10px;min-width:110px}
.sortBox{display:flex;flex-direction:column;align-items:center;background:var(--panel);border:2px solid #cfd8c4;border-radius:10px;padding:6px 8px;font-size:13px;gap:4px}
.sortBox div{display:flex;gap:6px}
.sortBox button{padding:6px 10px;font-size:12px;min-width:0}

/* ---------- Колода справа внизу ---------- */
#deckBox{position:absolute;right:14px;bottom:14px;width:92px;height:126px;border-radius:8px;border:3px solid #fff;background:repeating-linear-gradient(45deg,#2b3ed0 0 6px,#1d2a8f 6px 12px);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;font-weight:700;font-size:14px;box-shadow:0 6px 14px rgba(0,0,0,.5)}
#deckCount{background:rgba(0,0,0,.6);padding:2px 8px;border-radius:6px}

/* ---------- Кнопки ---------- */
button{background:#27ae60;color:#fff;border:none;padding:10px 14px;border-radius:8px;font-size:14px;cursor:pointer;transition:transform .1s,box-shadow .1s;box-shadow:0 4px 0 rgba(0,0,0,.35)}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
button:disabled{background:#555;cursor:not-allowed;box-shadow:none}
button.alt{background:#1b8be0}
button.red{background:#e0412f}
button.gray{background:#7f8c8d}
button.orange{background:#f39c12}

/* ---------- Оверлеи ---------- */
.overlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
.overlay.show{display:flex}
.panel{background:var(--panel);border-radius:10px;padding:12px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
.item{display:flex;justify-content:space-between;align-items:center;background:#1e3026;padding:8px;border-radius:6px;margin-bottom:6px;font-size:14px;gap:6px}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #fff2}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button{flex:1}
h2.t{text-align:center;color:var(--gold);margin:0 0 10px}
#shopMsg{text-align:center;color:#ffe08a;min-height:20px;margin-bottom:6px;font-size:14px}
.popup{position:fixed;top:40%;left:50%;font-size:30px;font-weight:bold;color:var(--gold);text-shadow:0 2px 4px #000;pointer-events:none;animation:float 1.2s forwards;z-index:10}

@keyframes deal{from{transform:translateY(-40px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes float{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-150%)}}

/* ---------- Узкий экран (телефон в портрете) ---------- */
@media (max-width:640px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  #side{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .blindBox{grid-column:span 3}
  .money b{font-size:22px}
  .gcard{width:60px;height:86px;margin-left:-14px}
  .gcard .pip{font-size:22px}
  #deckBox{width:64px;height:90px;font-size:11px}
  .bottom button{min-width:0;padding:10px 12px;font-size:13px}
}
</style>
</head>
<body>

<div id="app">

  <!-- ЛЕВАЯ ПАНЕЛЬ: блайнд, очки, руки, сбросы, деньги -->
  <aside id="side">
    <div class="blindBox">
      <div id="blindStat" class="blindName">-</div>
      <div id="bossInfo" class="bossInfo"></div>
      <div class="target">Score at least<b id="target">-</b></div>
    </div>
    <div class="box">Round score<b id="score">0</b></div>
    <div class="row2">
      <div class="box">Hands<b id="hands">0</b></div>
      <div class="box">Discards<b id="discards">0</b></div>
    </div>
    <div class="box money">Money<b id="money">$0</b></div>
    <div class="row2">
      <div class="box">Ante<b id="ante">-</b></div>
      <div class="box">Deck<b id="deckLeft">0</b></div>
    </div>
    <div class="sideBtns">
      <button id="boardBtn" class="alt">🏆 Рейтинг</button>
      <button id="soundBtn" class="gray">🔊</button>
    </div>
  </aside>

  <!-- ГЛАВНАЯ ОБЛАСТЬ -->
  <main id="main">
    <div class="topbar">
      <div id="jokers" class="jokers"></div>
      <div id="consumables"></div>
    </div>

    <div id="lastHand" style="display:none">Комбинация: —</div>
    <div id="curHand" class="curHand"></div>
    <div id="msg"></div>

    <div id="hand" class="hand"></div>

    <div class="bottom">
      <button id="playBtn" class="alt">Play Hand</button>
      <div class="sortBox">
        <span>Sort Hand</span>
        <div>
          <button id="sortBtn" class="orange">🔀 Сорт.</button>
        </div>
      </div>
      <button id="discardBtn" class="red">Discard</button>
      <button id="skipBtn" class="gray">⏭ Пропуск</button>
    </div>
  </main>

  <!-- КОЛОДА -->
  <div id="deckBox"><span id="deckCount">0</span></div>

  <!-- ОВЕРЛЕИ -->
  <div class="overlay show" id="menu">
    <div class="panel">
      <h2 class="t" id="menuTitle">Выбор колоды</h2>
      <div id="deckList"></div>
      <button id="continueBtn" class="alt" style="width:100%;margin-top:8px;display:none">Продолжить сохранённую игру</button>
    </div>
  </div>

  <div class="overlay" id="shop">
    <div class="panel">
      <h2 class="t">🛒 Магазин</h2>
      <div id="shopMsg"></div>
      <div id="shopItems"></div>
      <button id="nextBtn" class="alt" style="width:100%;margin-top:6px">Дальше ▶</button>
    </div>
  </div>

  <div class="overlay" id="board">
    <div class="panel">
      <h2 class="t" id="boardTitle">🏆 Таблица лидеров</h2>
      <div class="tabs">
        <button id="tabWeek" class="alt">Неделя</button>
        <button id="tabAll" class="gray">Всё время</button>
      </div>
      <div id="boardList">Загрузка...</div>
      <button class="gray" id="closeBoard" style="width:100%;margin-top:8px">Закрыть</button>
    </div>
  </div>

</div>

<script>
const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();

// Адрес API (сервер на Render). Без слэша в конце.
const API_URL = 'https://balatro-api-bkul.onrender.com';
const $ = id => document.getElementById(id);

/* ---------- Константы ---------- */
const SUITS = ['♠','♥','♦','♣'];

const BOSSES = {

  desert: {name:'Пустыня',  desc:'Сбросы недоступны'},
  hook:   {name:'Крюк',     desc:'Первая карта руки не даёт фишек'},
};
const BOSS_IDS = Object.keys(BOSSES);
const MAX_ANTE = 8;
const pickBoss = () => BOSS_IDS[Math.floor(Math.random() * BOSS_IDS.length)];
const baseTarget = ante => Math.floor(300 * Math.pow(1.7, ante - 1));
const blindTarget = () => Math.round(baseTarget(G.ante) * BLINDS[G.blindIdx].mult / 10) * 10;

/* ---------- Редкость джокеров ---------- */
const RARITY_NAME = {common:'Обычный', uncommon:'Необычный', rare:'Редкий'};
const RARITY_WEIGHTS = [['common',70], ['uncommon',25], ['rare',5]];

/* ---------- Джокеры ---------- */
const JOKERS = [
  // Обычные (70%)
  {id:'happy',   name:'Весёлый',    cost:3, rarity:'common', desc:'+4 множителя', score:()=>({mult:4})},
  {id:'greedy',  name:'Жадный',     cost:4, rarity:'common', desc:'+3 фишки за каждую ♦',
     score:({cards})=>({chips:3*cards.filter(c=>c.suit==='♦').length})},
  {id:'stone',   name:'Камень',     cost:4, rarity:'common', desc:'+50 фишек', score:()=>({chips:50})},
  {id:'ace',     name:'Туз',        cost:4, rarity:'common', desc:'+11 фишек за каждый туз',
     score:({cards})=>({chips:11*cards.filter(c=>c.rank==='A').length})},
  {id:'lazy',    name:'Ленивый',    cost:4, rarity:'common', desc:'+10 множителя, если сыграно ≤2 карт',
     score:({cards})=>({mult:cards.length<=2?10:0})},
  {id:'collector', name:'Сборщик',  cost:4, rarity:'common', desc:'+$1 за каждый сброс',
     onDiscard:()=>({money:1}), trigger:'сброс'},
  {id:'rich',   name:'Копилка',     cost:5, rarity:'common', desc:'+$3 в конце каждого блайнда',
     onRoundEnd:()=>({money:3}), trigger:'конец блайнда'},
  {id:'archaeo',name:'Археолог',    cost:4, rarity:'common', desc:'+$2 за каждый неиспользованный
